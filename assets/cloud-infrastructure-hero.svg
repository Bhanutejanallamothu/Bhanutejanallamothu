<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Node Glow Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
      <circle cx="24" cy="24" r="0.8" fill="#334155" opacity="0.8"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Container Box -->
  <rect width="900" height="240" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.2" />
  <rect width="900" height="240" rx="12" fill="url(#grid)" />

  <!-- Top Dashboard Bar -->
  <rect x="0" y="0" width="900" height="38" rx="12" fill="#161b22" opacity="0.9" />
  <line x1="0" y1="38" x2="900" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Window controls -->
  <circle cx="20" cy="19" r="4.5" fill="#f87171" opacity="0.8" />
  <circle cx="36" cy="19" r="4.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="52" cy="19" r="4.5" fill="#4ade80" opacity="0.8" />

  <!-- Header Title & Telemetry -->
  <text x="75" y="23" fill="#94a3b8" font-size="11" class="mono">cloud://aws-vpc/k8s-cluster/topology</text>
  
  <rect x="670" y="10" width="210" height="20" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="0.8" />
  <circle cx="682" cy="20" r="3.5" fill="#22c55e" filter="url(#glow)" />
  <text x="694" y="24" fill="#4ade80" font-size="10" font-weight="600" class="mono">STATUS: CLUSTER HEALTHY</text>

  <!-- ==================== FLOW CONNECTORS ==================== -->
  <!-- Connector: Git to CI/CD -->
  <path d="M 230 135 L 305 135" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="5 3" opacity="0.8"/>
  <polygon points="307,135 299,131 299,139" fill="#38bdf8" />

  <!-- Connector: CI/CD to Docker Hub -->
  <path d="M 505 135 L 565 135" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="5 3" opacity="0.8"/>
  <polygon points="567,135 559,131 559,139" fill="#38bdf8" />

  <!-- Connector: Docker Hub to K8s Ingress -->
  <path d="M 685 135 L 725 135" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="5 3" opacity="0.8"/>
  <polygon points="727,135 719,131 719,139" fill="#38bdf8" />

  <!-- ==================== NODE 1: SOURCE & GIT ==================== -->
  <g transform="translate(30, 60)">
    <!-- Node Container -->
    <rect width="200" height="150" rx="8" fill="#0d1117" stroke="#ea580c" stroke-width="1.2" opacity="0.95" />
    <rect width="200" height="26" rx="8" fill="#1c1917" />
    <text x="12" y="17" fill="#fb923c" font-size="11" font-weight="600" class="mono">01 · SOURCE CONTROL</text>

    <!-- Branch Graphic -->
    <line x1="30" y1="50" x2="170" y2="50" stroke="#f97316" stroke-width="2" />
    <circle cx="35" cy="50" r="4.5" fill="#0d1117" stroke="#f97316" stroke-width="2" />
    <circle cx="85" cy="50" r="4.5" fill="#f97316" />
    <circle cx="165" cy="50" r="4.5" fill="#0d1117" stroke="#f97316" stroke-width="2" />

    <!-- Feature Branch -->
    <path d="M 85 50 Q 105 85 125 85 L 145 85 Q 155 85 165 50" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="3 2" />
    <circle cx="135" cy="85" r="3.5" fill="#fb923c" />

    <text x="16" y="112" fill="#e2e8f0" font-size="11" font-weight="600" class="sans">Git Branch: main</text>
    <text x="16" y="128" fill="#64748b" font-size="9.5" class="mono">commit: 7a9f2e · PR merged</text>
    <rect x="16" y="134" width="75" height="14" rx="3" fill="#292524" />
    <text x="21" y="144" fill="#fdba74" font-size="8.5" class="mono">PUSH TRIGGER</text>
  </g>

  <!-- ==================== NODE 2: CI/CD ENGINE ==================== -->
  <g transform="translate(310, 60)">
    <rect width="195" height="150" rx="8" fill="#0d1117" stroke="#0284c7" stroke-width="1.2" opacity="0.95" />
    <rect width="195" height="26" rx="8" fill="#0c4a6e" opacity="0.4" />
    <text x="12" y="17" fill="#38bdf8" font-size="11" font-weight="600" class="mono">02 · JENKINS PIPELINE</text>

    <!-- Pipeline Stages -->
    <g transform="translate(14, 38)">
      <!-- Stage 1 -->
      <rect x="0" y="0" width="167" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <circle cx="12" cy="11" r="3.5" fill="#22c55e" />
      <text x="24" y="15" fill="#f1f5f9" font-size="9.5" class="mono">1. Checkout &amp; Verify</text>

      <!-- Stage 2 -->
      <rect x="0" y="28" width="167" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <circle cx="12" cy="39" r="3.5" fill="#22c55e" />
      <text x="24" y="43" fill="#f1f5f9" font-size="9.5" class="mono">2. Maven Build App</text>

      <!-- Stage 3 -->
      <rect x="0" y="56" width="167" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="12" cy="67" r="3.5" fill="#38bdf8" filter="url(#glow)" />
      <text x="24" y="71" fill="#38bdf8" font-size="9.5" font-weight="600" class="mono">3. Build Docker Image</text>

      <!-- Stage 4 -->
      <rect x="0" y="84" width="167" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <circle cx="12" cy="95" r="3.5" fill="#22c55e" />
      <text x="24" y="99" fill="#f1f5f9" font-size="9.5" class="mono">4. Deploy to Cluster</text>
    </g>
  </g>

  <!-- ==================== NODE 3: DOCKER ARTIFACT ==================== -->
  <g transform="translate(570, 75)">
    <rect width="115" height="120" rx="8" fill="#0d1117" stroke="#2563eb" stroke-width="1.2" opacity="0.95" />
    <rect width="115" height="24" rx="8" fill="#1e3a8a" opacity="0.4" />
    <text x="10" y="16" fill="#60a5fa" font-size="10" font-weight="600" class="mono">REGISTRY</text>

    <!-- Container Icon graphic -->
    <rect x="36" y="38" width="42" height="34" rx="3" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
    <line x1="48" y1="44" x2="56" y2="44" stroke="#60a5fa" stroke-width="1.5" />
    <line x1="60" y1="44" x2="68" y2="44" stroke="#60a5fa" stroke-width="1.5" />
    <line x1="48" y1="52" x2="56" y2="52" stroke="#60a5fa" stroke-width="1.5" />
    <line x1="60" y1="52" x2="68" y2="52" stroke="#60a5fa" stroke-width="1.5" />
    <line x1="48" y1="60" x2="68" y2="60" stroke="#60a5fa" stroke-width="1.5" />

    <text x="16" y="88" fill="#93c5fd" font-size="9" font-weight="600" class="mono">cicd-news:latest</text>
    <rect x="18" y="96" width="78" height="14" rx="3" fill="#166534" />
    <text x="24" y="106" fill="#86efac" font-size="8" class="mono">IMAGE READY</text>
  </g>

  <!-- ==================== NODE 4: KUBERNETES & TRAFFIC ==================== -->
  <g transform="translate(730, 60)">
    <rect width="140" height="150" rx="8" fill="#0d1117" stroke="#16a34a" stroke-width="1.2" opacity="0.95" />
    <rect width="140" height="26" rx="8" fill="#14532d" opacity="0.4" />
    <text x="10" y="17" fill="#4ade80" font-size="10.5" font-weight="600" class="mono">03 · K8S CLUSTER</text>

    <!-- Ingress Node -->
    <rect x="12" y="36" width="116" height="22" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="0.8" />
    <text x="20" y="50" fill="#86efac" font-size="9" class="mono">Ingress Controller</text>

    <!-- Frontend Pods -->
    <rect x="12" y="66" width="116" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
    <circle cx="22" cy="76" r="3" fill="#22c55e" />
    <text x="30" y="80" fill="#e2e8f0" font-size="8.5" class="mono">frontend-pod (x2)</text>

    <!-- Backend Pods -->
    <rect x="12" y="92" width="116" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
    <circle cx="22" cy="102" r="3" fill="#22c55e" />
    <text x="30" y="106" fill="#e2e8f0" font-size="8.5" class="mono">backend-pod (x2)</text>

    <!-- Database Container -->
    <rect x="12" y="118" width="116" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
    <circle cx="22" cy="128" r="3" fill="#38bdf8" />
    <text x="30" y="132" fill="#94a3b8" font-size="8.5" class="mono">mysql-service :3306</text>
  </g>
</svg>
