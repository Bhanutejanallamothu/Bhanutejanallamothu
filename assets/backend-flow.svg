<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 105" width="100%" height="100%">
  <defs>
    <linearGradient id="beBoxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes beFlow {
      to { stroke-dashoffset: -16; }
    }
    .flow-be {
      stroke-dasharray: 5 3;
      animation: beFlow 1.8s linear infinite;
    }
  </style>

  <rect width="880" height="105" rx="8" fill="url(#beBoxBg)" stroke="#30363d" stroke-width="1" />

  <!-- Flow Arrows -->
  <line x1="165" y1="52" x2="205" y2="52" stroke="#22c55e" stroke-width="1.8" class="flow-be" />
  <polygon points="207,52 199,48 199,56" fill="#22c55e" />

  <line x1="335" y1="52" x2="375" y2="52" stroke="#22c55e" stroke-width="1.8" class="flow-be" />
  <polygon points="377,52 369,48 369,56" fill="#22c55e" />

  <line x1="505" y1="52" x2="545" y2="52" stroke="#22c55e" stroke-width="1.8" class="flow-be" />
  <polygon points="547,52 539,48 539,56" fill="#22c55e" />

  <line x1="675" y1="52" x2="715" y2="52" stroke="#22c55e" stroke-width="1.8" class="flow-be" />
  <polygon points="717,52 709,48 709,56" fill="#22c55e" />

  <!-- Node 1: Client Request -->
  <g transform="translate(20, 16)">
    <rect width="145" height="72" rx="6" fill="#0d1117" stroke="#16a34a" stroke-width="1" />
    <rect width="145" height="18" rx="6" fill="#14532d" opacity="0.4" />
    <text x="10" y="13" fill="#4ade80" font-size="9" font-weight="700" class="mono">CLIENT REQUEST</text>
    <text x="10" y="38" fill="#f8fafc" font-size="11" font-weight="600" class="sans">HTTP / Headers</text>
    <text x="10" y="54" fill="#94a3b8" font-size="8.5" class="mono">GET / POST / WS</text>
  </g>

  <!-- Node 2: API Endpoint & Routing -->
  <g transform="translate(205, 16)">
    <rect width="130" height="72" rx="6" fill="#0d1117" stroke="#16a34a" stroke-width="1" />
    <rect width="130" height="18" rx="6" fill="#14532d" opacity="0.4" />
    <text x="10" y="13" fill="#4ade80" font-size="9" font-weight="700" class="mono">API ROUTER</text>
    <text x="10" y="38" fill="#f8fafc" font-size="11" font-weight="600" class="sans">Endpoints</text>
    <text x="10" y="54" fill="#94a3b8" font-size="8.5" class="mono">Validation &amp; DTOs</text>
  </g>

  <!-- Node 3: Business Logic -->
  <g transform="translate(375, 16)">
    <rect width="130" height="72" rx="6" fill="#0d1117" stroke="#16a34a" stroke-width="1" />
    <rect width="130" height="18" rx="6" fill="#14532d" opacity="0.4" />
    <text x="10" y="13" fill="#4ade80" font-size="9" font-weight="700" class="mono">SERVICE LAYER</text>
    <text x="10" y="38" fill="#f8fafc" font-size="11" font-weight="600" class="sans">Business Logic</text>
    <text x="10" y="54" fill="#94a3b8" font-size="8.5" class="mono">Auth · Transactions</text>
  </g>

  <!-- Node 4: Database / External Service -->
  <g transform="translate(545, 16)">
    <rect width="130" height="72" rx="6" fill="#0d1117" stroke="#16a34a" stroke-width="1" />
    <rect width="130" height="18" rx="6" fill="#14532d" opacity="0.4" />
    <text x="10" y="13" fill="#4ade80" font-size="9" font-weight="700" class="mono">PERSISTENCE / EXT</text>
    <text x="10" y="38" fill="#f8fafc" font-size="11" font-weight="600" class="sans">JDBC / ORM / APIs</text>
    <text x="10" y="54" fill="#94a3b8" font-size="8.5" class="mono">PostgreSQL · MySQL</text>
  </g>

  <!-- Node 5: JSON Response -->
  <g transform="translate(715, 16)">
    <rect width="145" height="72" rx="6" fill="#0d1117" stroke="#22c55e" stroke-width="1" />
    <rect width="145" height="18" rx="6" fill="#15803d" opacity="0.4" />
    <text x="10" y="13" fill="#86efac" font-size="9" font-weight="700" class="mono">STRUCTURED RES</text>
    <text x="10" y="38" fill="#f8fafc" font-size="11" font-weight="600" class="sans">JSON Payload</text>
    <text x="10" y="54" fill="#86efac" font-size="8.5" class="mono">200 OK · Error schemas</text>
  </g>
</svg>
