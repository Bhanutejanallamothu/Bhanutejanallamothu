<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="100%" height="100%">
  <defs>
    <linearGradient id="cvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes cvFlow {
      to { stroke-dashoffset: -16; }
    }
    .flow-cv {
      stroke-dasharray: 5 3;
      animation: cvFlow 1.6s linear infinite;
    }
  </style>

  <rect width="880" height="170" rx="8" fill="url(#cvBg)" stroke="#30363d" stroke-width="1" />

  <!-- Flow Lines -->
  <line x1="150" y1="85" x2="185" y2="85" stroke="#4ade80" stroke-width="1.8" class="flow-cv" />
  <polygon points="187,85 179,81 179,89" fill="#4ade80" />

  <line x1="320" y1="85" x2="355" y2="85" stroke="#4ade80" stroke-width="1.8" class="flow-cv" />
  <polygon points="357,85 349,81 349,89" fill="#4ade80" />

  <line x1="495" y1="85" x2="530" y2="85" stroke="#4ade80" stroke-width="1.8" class="flow-cv" />
  <polygon points="532,85 524,81 524,89" fill="#4ade80" />

  <line x1="695" y1="85" x2="730" y2="85" stroke="#4ade80" stroke-width="1.8" class="flow-cv" />
  <polygon points="732,85 724,81 724,89" fill="#4ade80" />

  <!-- Stage 1: Input Image -->
  <g transform="translate(20, 25)">
    <rect width="130" height="120" rx="6" fill="#0d1117" stroke="#16a34a" stroke-width="1" />
    <rect width="130" height="22" rx="6" fill="#14532d" opacity="0.5" />
    <text x="10" y="15" fill="#4ade80" font-size="9" font-weight="700" class="mono">01 · INPUT IMAGE</text>
    
    <!-- Image placeholder graphic -->
    <rect x="25" y="34" width="80" height="52" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <circle cx="45" cy="50" r="6" fill="#4ade80" opacity="0.6" />
    <path d="M 30 78 L 50 58 L 70 78 Z" fill="#334155" />
    <path d="M 55 78 L 75 64 L 95 78 Z" fill="#475569" />

    <text x="14" y="102" fill="#e2e8f0" font-size="9" font-weight="600" class="sans">Camera Frame</text>
    <text x="14" y="116" fill="#64748b" font-size="8" class="mono">Raw RGB Payload</text>
  </g>

  <!-- Stage 2: OpenCV Preprocessing -->
  <g transform="translate(185, 25)">
    <rect width="135" height="120" rx="6" fill="#0d1117" stroke="#16a34a" stroke-width="1" />
    <rect width="135" height="22" rx="6" fill="#14532d" opacity="0.5" />
    <text x="10" y="15" fill="#4ade80" font-size="9" font-weight="700" class="mono">02 · PREPROCESSING</text>
    
    <rect x="10" y="34" width="115" height="18" rx="3" fill="#1e293b" />
    <text x="16" y="46" fill="#e2e8f0" font-size="8.5" class="mono">OpenCV Resize</text>

    <rect x="10" y="56" width="115" height="18" rx="3" fill="#1e293b" />
    <text x="16" y="68" fill="#e2e8f0" font-size="8.5" class="mono">640x640 Normalization</text>

    <rect x="10" y="78" width="115" height="18" rx="3" fill="#1e293b" />
    <text x="16" y="90" fill="#e2e8f0" font-size="8.5" class="mono">Tensor Batching</text>

    <text x="12" y="116" fill="#86efac" font-size="8" class="mono">NumPy array (1,3,640,640)</text>
  </g>

  <!-- Stage 3: YOLOv8 Inference Engine -->
  <g transform="translate(355, 25)">
    <rect width="140" height="120" rx="6" fill="#0d1117" stroke="#22c55e" stroke-width="1.2" />
    <rect width="140" height="22" rx="6" fill="#15803d" opacity="0.5" />
    <text x="10" y="15" fill="#86efac" font-size="9" font-weight="700" class="mono">03 · YOLOV8 INFERENCE</text>
    
    <text x="12" y="44" fill="#f8fafc" font-size="10.5" font-weight="600" class="sans">Ultralytics YOLOv8</text>
    <text x="12" y="60" fill="#94a3b8" font-size="8.5" class="mono">Darknet Backbone</text>
    
    <rect x="12" y="70" width="116" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <text x="18" y="84" fill="#38bdf8" font-size="8.5" class="mono">Feature Pyramid Head</text>

    <rect x="12" y="100" width="85" height="16" rx="3" fill="#166534" />
    <text x="18" y="111" fill="#bbf7d0" font-size="8" font-weight="600" class="mono">NMS EVALUATION</text>
  </g>

  <!-- Stage 4: Detected Components & Bounding Boxes -->
  <g transform="translate(530, 25)">
    <rect width="165" height="120" rx="6" fill="#0d1117" stroke="#16a34a" stroke-width="1" />
    <rect width="165" height="22" rx="6" fill="#14532d" opacity="0.5" />
    <text x="10" y="15" fill="#4ade80" font-size="9" font-weight="700" class="mono">04 · LOCALIZATION</text>
    
    <!-- Illustrative Bounding Boxes -->
    <rect x="12" y="32" width="141" height="24" rx="3" fill="#052e16" stroke="#22c55e" stroke-width="1" />
    <text x="18" y="47" fill="#86efac" font-size="9" font-weight="600" class="mono">[Box] alternator : 0.94</text>

    <rect x="12" y="60" width="141" height="24" rx="3" fill="#052e16" stroke="#22c55e" stroke-width="1" />
    <text x="18" y="75" fill="#86efac" font-size="9" font-weight="600" class="mono">[Box] battery : 0.91</text>

    <rect x="12" y="88" width="141" height="24" rx="3" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
    <text x="18" y="103" fill="#7dd3fc" font-size="9" font-weight="600" class="mono">[Box] air_intake : 0.88</text>

    <text x="14" y="128" fill="#64748b" font-size="7.5" class="mono">*Illustrative inference bounding</text>
  </g>

  <!-- Stage 5: Structured API Response -->
  <g transform="translate(730, 25)">
    <rect width="130" height="120" rx="6" fill="#0d1117" stroke="#16a34a" stroke-width="1" />
    <rect width="130" height="22" rx="6" fill="#14532d" opacity="0.5" />
    <text x="10" y="15" fill="#4ade80" font-size="9" font-weight="700" class="mono">05 · API RESPONSE</text>
    
    <text x="12" y="42" fill="#38bdf8" font-size="8.5" class="mono">POST /identify-part</text>
    
    <rect x="10" y="52" width="110" height="52" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
    <text x="16" y="66" fill="#94a3b8" font-size="7.5" class="mono">{"detected": [</text>
    <text x="22" y="78" fill="#86efac" font-size="7.5" class="mono">{"class": "alternator",</text>
    <text x="22" y="90" fill="#86efac" font-size="7.5" class="mono"> "confidence": 0.94}</text>
    <text x="16" y="100" fill="#94a3b8" font-size="7.5" class="mono">]}</text>

    <rect x="12" y="112" width="60" height="14" rx="2" fill="#14532d" />
    <text x="16" y="122" fill="#86efac" font-size="8" class="mono">200 OK</text>
  </g>
</svg>
