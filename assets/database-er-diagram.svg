<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 155" width="100%" height="100%">
  <defs>
    <linearGradient id="dbBoxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <rect width="880" height="155" rx="8" fill="url(#dbBoxBg)" stroke="#30363d" stroke-width="1" />

  <!-- Entity 1: users -->
  <g transform="translate(30, 20)">
    <rect width="230" height="115" rx="6" fill="#0d1117" stroke="#d97706" stroke-width="1.2" />
    <rect width="230" height="24" rx="6" fill="#78350f" opacity="0.5" />
    <text x="12" y="16" fill="#fbbf24" font-size="10" font-weight="700" class="mono">TABLE · users</text>

    <text x="12" y="42" fill="#fbbf24" font-size="9" font-weight="600" class="mono">PK  id</text>
    <text x="75" y="42" fill="#e2e8f0" font-size="9" class="mono">BIGINT (Auto)</text>

    <text x="12" y="60" fill="#94a3b8" font-size="9" class="mono">UK  username</text>
    <text x="95" y="60" fill="#e2e8f0" font-size="9" class="mono">VARCHAR(50)</text>

    <text x="12" y="78" fill="#94a3b8" font-size="9" class="mono">UK  email</text>
    <text x="75" y="78" fill="#e2e8f0" font-size="9" class="mono">VARCHAR(100)</text>

    <text x="12" y="96" fill="#64748b" font-size="9" class="mono">    created_at</text>
    <text x="95" y="96" fill="#94a3b8" font-size="9" class="mono">TIMESTAMP</text>
  </g>

  <!-- Relationship Line: users -> bookmarks -->
  <path d="M 260 55 L 325 55" stroke="#f59e0b" stroke-width="1.8" />
  <circle cx="265" cy="55" r="3" fill="#f59e0b" />
  <!-- Crow's foot notation -->
  <path d="M 325 55 L 315 48 M 325 55 L 315 62" stroke="#f59e0b" stroke-width="1.8" />
  <text x="272" y="46" fill="#fbbf24" font-size="8" class="mono">1 : N</text>

  <!-- Entity 2: bookmarks -->
  <g transform="translate(325, 20)">
    <rect width="240" height="115" rx="6" fill="#0d1117" stroke="#d97706" stroke-width="1.2" />
    <rect width="240" height="24" rx="6" fill="#78350f" opacity="0.5" />
    <text x="12" y="16" fill="#fbbf24" font-size="10" font-weight="700" class="mono">TABLE · bookmarks</text>

    <text x="12" y="42" fill="#fbbf24" font-size="9" font-weight="600" class="mono">PK  id</text>
    <text x="75" y="42" fill="#e2e8f0" font-size="9" class="mono">BIGINT (Auto)</text>

    <text x="12" y="60" fill="#38bdf8" font-size="9" font-weight="600" class="mono">FK  user_id</text>
    <text x="95" y="60" fill="#e2e8f0" font-size="9" class="mono">BIGINT (Indexed)</text>

    <text x="12" y="78" fill="#94a3b8" font-size="9" class="mono">    article_id</text>
    <text x="95" y="78" fill="#e2e8f0" font-size="9" class="mono">VARCHAR(128)</text>

    <text x="12" y="96" fill="#64748b" font-size="9" class="mono">    saved_at</text>
    <text x="95" y="96" fill="#94a3b8" font-size="9" class="mono">TIMESTAMP</text>
  </g>

  <!-- Entity 3: metrics_timeseries -->
  <g transform="translate(610, 20)">
    <rect width="240" height="115" rx="6" fill="#0d1117" stroke="#d97706" stroke-width="1.2" />
    <rect width="240" height="24" rx="6" fill="#78350f" opacity="0.5" />
    <text x="12" y="16" fill="#fbbf24" font-size="10" font-weight="700" class="mono">TABLE · telemetry_store</text>

    <text x="12" y="42" fill="#fbbf24" font-size="9" font-weight="600" class="mono">PK  metric_id</text>
    <text x="95" y="42" fill="#e2e8f0" font-size="9" class="mono">UUID / BIGINT</text>

    <text x="12" y="60" fill="#38bdf8" font-size="9" font-weight="600" class="mono">IDX service_key</text>
    <text x="110" y="60" fill="#e2e8f0" font-size="9" class="mono">VARCHAR(64)</text>

    <text x="12" y="78" fill="#94a3b8" font-size="9" class="mono">    cpu / ram_pct</text>
    <text x="110" y="78" fill="#e2e8f0" font-size="9" class="mono">FLOAT / NUMERIC</text>

    <text x="12" y="96" fill="#64748b" font-size="9" class="mono">IDX recorded_at</text>
    <text x="110" y="96" fill="#94a3b8" font-size="9" class="mono">TIMESTAMPTZ</text>
  </g>
</svg>
