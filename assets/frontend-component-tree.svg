<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 105" width="100%" height="100%">
  <defs>
    <linearGradient id="feBoxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes feFlow {
      to { stroke-dashoffset: -16; }
    }
    .flow-fe {
      stroke-dasharray: 5 3;
      animation: feFlow 1.8s linear infinite;
    }
  </style>

  <rect width="880" height="105" rx="8" fill="url(#feBoxBg)" stroke="#30363d" stroke-width="1" />

  <!-- Flow Arrows -->
  <line x1="165" y1="52" x2="205" y2="52" stroke="#38bdf8" stroke-width="1.8" class="flow-fe" />
  <polygon points="207,52 199,48 199,56" fill="#38bdf8" />

  <line x1="335" y1="52" x2="375" y2="52" stroke="#38bdf8" stroke-width="1.8" class="flow-fe" />
  <polygon points="377,52 369,48 369,56" fill="#38bdf8" />

  <line x1="505" y1="52" x2="545" y2="52" stroke="#38bdf8" stroke-width="1.8" class="flow-fe" />
  <polygon points="547,52 539,48 539,56" fill="#38bdf8" />

  <line x1="675" y1="52" x2="715" y2="52" stroke="#38bdf8" stroke-width="1.8" class="flow-fe" />
  <polygon points="717,52 709,48 709,56" fill="#38bdf8" />

  <!-- Node 1: Viewport / Browser -->
  <g transform="translate(20, 16)">
    <rect width="145" height="72" rx="6" fill="#0d1117" stroke="#0284c7" stroke-width="1" />
    <rect width="145" height="18" rx="6" fill="#0c4a6e" opacity="0.4" />
    <text x="10" y="13" fill="#38bdf8" font-size="9" font-weight="700" class="mono">CLIENT VIEWPORT</text>
    <text x="10" y="38" fill="#f8fafc" font-size="11" font-weight="600" class="sans">Responsive UI</text>
    <text x="10" y="54" fill="#94a3b8" font-size="8.5" class="mono">Mobile · Tablet · Web</text>
  </g>

  <!-- Node 2: App Router / Structure -->
  <g transform="translate(205, 16)">
    <rect width="130" height="72" rx="6" fill="#0d1117" stroke="#0284c7" stroke-width="1" />
    <rect width="130" height="18" rx="6" fill="#0c4a6e" opacity="0.4" />
    <text x="10" y="13" fill="#38bdf8" font-size="9" font-weight="700" class="mono">APP ROUTER</text>
    <text x="10" y="38" fill="#f8fafc" font-size="11" font-weight="600" class="sans">Next.js / Vite</text>
    <text x="10" y="54" fill="#94a3b8" font-size="8.5" class="mono">Page Transitions</text>
  </g>

  <!-- Node 3: Component Hierarchy -->
  <g transform="translate(375, 16)">
    <rect width="130" height="72" rx="6" fill="#0d1117" stroke="#0284c7" stroke-width="1" />
    <rect width="130" height="18" rx="6" fill="#0c4a6e" opacity="0.4" />
    <text x="10" y="13" fill="#38bdf8" font-size="9" font-weight="700" class="mono">COMPONENTS</text>
    <text x="10" y="38" fill="#f8fafc" font-size="11" font-weight="600" class="sans">React Hierarchy</text>
    <text x="10" y="54" fill="#94a3b8" font-size="8.5" class="mono">Typed Props &amp; Slots</text>
  </g>

  <!-- Node 4: State & Data Binding -->
  <g transform="translate(545, 16)">
    <rect width="130" height="72" rx="6" fill="#0d1117" stroke="#0284c7" stroke-width="1" />
    <rect width="130" height="18" rx="6" fill="#0c4a6e" opacity="0.4" />
    <text x="10" y="13" fill="#38bdf8" font-size="9" font-weight="700" class="mono">STATE BINDING</text>
    <text x="10" y="38" fill="#f8fafc" font-size="11" font-weight="600" class="sans">Hooks &amp; Streams</text>
    <text x="10" y="54" fill="#94a3b8" font-size="8.5" class="mono">SSE / WebSocket sync</text>
  </g>

  <!-- Node 5: Tailwind & Design Tokens -->
  <g transform="translate(715, 16)">
    <rect width="145" height="72" rx="6" fill="#0d1117" stroke="#06b6d4" stroke-width="1" />
    <rect width="145" height="18" rx="6" fill="#083344" opacity="0.4" />
    <text x="10" y="13" fill="#22d3ee" font-size="9" font-weight="700" class="mono">STYLING ENGINE</text>
    <text x="10" y="38" fill="#f8fafc" font-size="11" font-weight="600" class="sans">Tailwind CSS</text>
    <text x="10" y="54" fill="#94a3b8" font-size="8.5" class="mono">Tokens · Dark Theme</text>
  </g>
</svg>
